name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Verify
        run: |
          go test ./...

      - name: Build linux amd64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/ngxsetup-linux-amd64 ./cmd/ngxsetup

      - name: Build linux arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/ngxsetup-linux-arm64 ./cmd/ngxsetup

      - name: Checksums
        run: |
          (cd dist && sha256sum ngxsetup-* > SHA256SUMS)

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ngxsetup-linux-amd64
            dist/ngxsetup-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
